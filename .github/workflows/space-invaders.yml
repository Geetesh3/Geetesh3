name: Generate Space Invaders

on:
  schedule:
    - cron: "10 */12 * * *" 
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: generate-space-invaders-svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Geetesh3
          outputs: |
            dist/github-contribution-grid-space-invaders.svg?palette=github-dark&color_snake=red&theme=space-invaders
            
      - name: push-to-output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

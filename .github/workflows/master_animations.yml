name: Generate Triple Animations

on:
  schedule:
    - cron: "0 */12 * * *" # Every 12 hours
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 1. Generate Pac-Man & Space Invaders
      - name: generate-snk-styles
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Geetesh3
          outputs: |
            dist/github-contribution-grid-pacman.svg?palette=github-dark&color_snake=yellow&theme=pacman
            dist/github-contribution-grid-space-invaders.svg?palette=github-dark&color_snake=red&theme=space-invaders

      # 2. Generate 3D Skyline (Isometric View)
      - name: generate-isometric-view
        uses: joshcai/isometric-contributions@main
        with:
          github_user_name: Geetesh3

      # 3. Move Skyline to dist folder
      - name: Organize Files
        run: |
          mkdir -p dist
          mv ./isometric-view.svg dist/ 2>/dev/null || true

      # 4. Push all three to the "output" branch
      - name: push-to-output-branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

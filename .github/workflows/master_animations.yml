name: Generate Master Animations

on:
  schedule:
    - cron: "0 */12 * * *" # Runs every 12 hours
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write  # This tells GitHub to allow the bot to write files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 1. Generate the Gamer Vibe (Pac-Man)
      - name: generate-pacman-animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Geetesh3
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=orange&theme=pacman
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=yellow&theme=pacman

      # 2. Generate the 3D Skyline (Architect View)
      - name: generate-3d-skyline
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Geetesh3

      # 3. Move 3D Skyline to the dist folder so everything pushes together
      - name: Move files to dist
        run: |
          mkdir -p dist
          mv profile-3d-contrib.svg dist/ 2>/dev/null || true

      # 4. Deploy all files to the "output" branch
      - name: push-to-output-branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
